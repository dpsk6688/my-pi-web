name: MY-PI-WEB v2.0 Auto Publish
on:
  push:
    tags: ['v*.*.*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install
          npx tsc --noEmit || true
      - uses: softprops/action-gh-release@v2
        with:
          files: README.md
